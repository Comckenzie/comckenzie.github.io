<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <header id="site-header"></header>

  <main id="main">
    <section class="section contact-section">
      <div class="container">
        <div class="section__head">
          <h1>Get in touch</h1>
        </div>
        <div class="contact-main" style="max-width: 700px; margin: 0 auto;">
          <p class="lead muted">Interested in working together or commissioning a piece? Send a brief message describing your project and I'll get back to you.</p>
          <div class="contact-info-row" style="display: flex; gap: 32px; flex-wrap: wrap; margin: 32px 0 0 0;">
            <div><strong>Email</strong><br /><a href="mailto:charliemckenziemusic@gmail.com">charliemckenziemusic@gmail.com</a></div>
            <div><strong>Phone</strong><br />530-955-1229</div>
            <div><strong>Discord</strong><br />solargress</div>
          </div>
          <div class="contact-social" style="margin-top:32px; justify-content: flex-start; gap: 18px;">
            <a class="iconbtn contact-social-btn" href="#" aria-label="Instagram" title="Instagram">
              <i class="fa-brands fa-instagram"></i>
              <span class="contact-social-label">Instagram</span>
            </a>
            <a class="iconbtn contact-social-btn" href="#" aria-label="X (Twitter)" title="X (Twitter)">
              <i class="fa-brands fa-x-twitter"></i>
              <span class="contact-social-label">X (Twitter)</span>
            </a>
            <a class="iconbtn contact-social-btn" href="#" aria-label="YouTube" title="YouTube">
              <i class="fa-brands fa-youtube"></i>
              <span class="contact-social-label">YouTube</span>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/nav.js" defer></script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/projects.js" defer></script>
  <script src="assets/js/crt.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
