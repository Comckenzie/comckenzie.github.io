<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Project details and personal projects." />
  <title>Project</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/mobile.css" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <header id="site-header"></header>

  <main id="main" role="main">
    <section class="section" aria-labelledby="project-heading">
      <div class="container">

        <div id="project-root" class="project" aria-live="polite"></div>
        <noscript><p class="muted">JavaScript is required to view project details. <a href="projects.html?source=personal">Browse projects</a>.</p></noscript>
      </div>
    </section>
  </main>

  <template id="project-template">
    <article class="project-page" role="article">
      <section class="project-hero__inner container no-banner">
        <div class="project-hero__title-col">
          <h1 class="project-hero__title accentuation-title"><span data-field="name"></span></h1>
          <p class="muted creator hidden" data-field="creator"></p>
        </div>
      </section>
      <section class="project-media container hidden" data-conditional="video">
        <div class="project-media__video" data-field="videoHtml"></div>
        <div class="project-media__desc">
          <p class="project-hero__desc" data-field="description"></p>
        </div>
      </section>
      <section class="project-desc container" data-conditional="no-video">
        <p class="project-hero__desc" data-field="description"></p>
      </section>
      <section class="project-content container">
        <div class="content-full">
          <div class="tracklist-card tracklist-card--full project-detail-split">
            <div class="project-detail-left">
              <img class="project-detail-image" data-field="image" data-alt="name" />
              <div class="project__player project__player--full" id="project-player" aria-label="Audio player">
                <div class="player__controls">
                  <button class="iconbtn" id="prev" aria-label="Previous"><i class="fa-solid fa-backward"></i></button>
                  <button class="iconbtn btn--play" id="play" aria-label="Play/Pause"><i class="fa-solid fa-play"></i></button>
                  <button class="iconbtn" id="next" aria-label="Next"><i class="fa-solid fa-forward"></i></button>
                  <div class="player__track" aria-live="polite">—</div>
                </div>
                <div class="player__timeline" role="progressbar" aria-label="Playback progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                  <div class="player__elapsed" style="width:0%"></div>
                </div>
              </div>
            </div>
            <div class="project-detail-right">
              <h3 class="tracklist-card__title"><span data-field="name"></span></h3>
              <ol class="tracklist" data-field="tracksHtml"></ol>
              <p class="muted no-tracks hidden">No tracks available.</p>
            </div>
          </div>
        </div>
      </section>
    </article>
  </template>

  <footer id="site-footer"></footer>
  <script src="assets/js/nav.js" defer></script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/projects.js" defer></script>
  <script src="assets/js/crt.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <script>
    if (window.initProjectPage) window.initProjectPage();
  </script>
</body>
</html>
